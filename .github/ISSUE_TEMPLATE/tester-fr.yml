name: Français — Je souhaite participer aux tests
description: Se porter volontaire pour BubbleBD et un éventuel test Google Play
title: "[Volontaire] "
labels: [testeur]
body:
  - type: markdown
    attributes:
      value: "Merci ! Votre pseudonyme GitHub suffit. Ce formulaire est PUBLIC : ne publiez ni adresse Google, ni e-mail, ni numéro de téléphone. La bêta GitHub est disponible ; le test fermé Google Play n'est pas encore ouvert. Nous annoncerons ici les prochaines étapes."
  - type: input
    id: device
    attributes:
      label: Modèle de téléphone et version Android
      placeholder: "Samsung Galaxy S23, Android 16"
    validations:
      required: true
  - type: dropdown
    id: interest
    attributes:
      label: Comment souhaitez-vous participer ?
      options:
        - Essayer la bêta et participer au futur test Google Play
        - Essayer uniquement la bêta GitHub
    validations:
      required: true
  - type: textarea
    id: reading
    attributes:
      label: Vos habitudes de lecture (facultatif)
      description: "BD, mangas, comics ; formats PDF, CBZ, CBR ; fonctionnalités à essayer. Aucun fichier de BD à joindre."
  - type: checkboxes
    id: understanding
    attributes:
      label: Participation
      options:
        - label: "Je comprends que le futur test Google Play demandera un compte Google et au moins 14 jours d'inscription continue avec de vrais essais ; les jours de bêta GitHub ne comptent pas pour ce délai."
          required: true
