name: English — Volunteer to test
description: Help test BubbleBD and potentially join a future Google Play test
title: "[Volunteer] "
labels: [testeur]
body:
  - type: markdown
    attributes:
      value: "Thank you! Your GitHub username is enough. This form is PUBLIC: do not post a Google email, any other email address or a phone number. The GitHub beta is available; the Google Play closed test has not started. Next steps will be announced here."
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Samsung Galaxy S23, Android 16"
    validations:
      required: true
  - type: dropdown
    id: interest
    attributes:
      label: How would you like to help?
      options:
        - Try the beta and join a future Google Play test
        - Try the GitHub beta only
    validations:
      required: true
  - type: textarea
    id: reading
    attributes:
      label: Your reading habits (optional)
      description: "Comics, manga or graphic novels; PDF, CBZ or CBR; features you would like to try. Please do not attach comic files."
  - type: checkboxes
    id: understanding
    attributes:
      label: Participation
      options:
        - label: "I understand that a future Google Play test will require a Google account, at least 14 days of continuous enrolment and real testing. Days spent using the GitHub beta do not count towards this period."
          required: true
