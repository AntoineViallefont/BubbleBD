name: Français — Proposer une amélioration
description: Une idée pour rendre la lecture plus agréable
title: "[Idée] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Quel besoin rencontrez-vous ?
      description: Expliquez la situation pendant laquelle cette amélioration vous serait utile.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Votre proposition
      description: Une idée simple suffit. Aucun vocabulaire technique nécessaire.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Les propositions sont publiques. Les fichiers BD et les corrections privées de votre bibliothèque ne sont pas partagés automatiquement."
