name: English — Suggest an improvement
description: An idea to make reading more enjoyable
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would help you?
      description: Describe a situation where this improvement would be useful.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your suggestion
      description: A simple idea is enough. No technical terminology needed.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Suggestions are public. Your comic files and local library edits are not automatically shared."
