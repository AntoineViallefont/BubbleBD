name: English — Report a problem
description: Reading, panel detection, library or book information
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping. This issue is PUBLIC: do not include full comics, personal information or credentials. Screenshots are optional and must be yours to share legally."
  - type: input
    id: version
    attributes:
      label: BubbleBD version
      description: Shown in Settings → About
      placeholder: "For example: 0.3.33"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "For example: Samsung Galaxy S23 Ultra, Android 16"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected feature
      options:
        - Reading and panel detection
        - Import and library
        - Book information lookup
        - OneDrive or Android storage provider
        - Language or translation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Describe the steps and what you expected. Include the file format (PDF, CBZ or CBR) if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional information
      description: Optional. For panel detection, describe the layout and whether the full page remains readable. Share only material you have permission to publish.
